version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nexus-mysql
    restart: always
    environment:
      MYSQL_DATABASE: private_chat
      MYSQL_USER: chat
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+aiomysql://chat:changeme@db:3306/private_chat
      - DATABASE_URL_SYNC=mysql+pymysql://chat:changeme@db:3306/private_chat
      - ENVIRONMENT=development

volumes:
  mysql_data:
