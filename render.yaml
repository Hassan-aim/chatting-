# ─────────────────────────────────────────────────────────────────────────────
# Render Free-Tier Deployment Blueprint
# ─────────────────────────────────────────────────────────────────────────────
#
#  Deploy guide (step-by-step):
#
#  1. Push this repo to GitHub
#  2. Go to https://dashboard.render.com → "New" → "Blueprint"
#  3. Connect your GitHub repo — Render detects this file and creates all services
#  4. Wait for the PostgreSQL database to be created (takes ~2 min)
#  5. Go to private-chat-db → "Connections" → copy the "Internal Database URL"
#  6. Go to private-chat-api → "Environment" tab → set these variables:
#
#       DATABASE_URL        = postgresql+asyncpg://<paste-internal-url-here>
#       DATABASE_URL_SYNC   = postgresql+psycopg://<paste-internal-url-here>
#       CORS_ORIGINS        = https://<your-frontend>.onrender.com
#
#     NOTE: Replace "postgresql://" with "postgresql+asyncpg://" and
#           "postgresql+psycopg://" respectively in the copied URL.
#
#  7. Go to private-chat-frontend → "Environment" tab → set:
#
#       VITE_API_BASE_URL   = https://<your-backend>.onrender.com
#       VITE_WS_BASE_URL    = wss://<your-backend>.onrender.com
#
#  8. Click "Manual Deploy" on both services
#
#  That's it! Backend runs Alembic migrations automatically on first boot.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend (FastAPI + WebSocket) ────────────────────────────────────────
  - type: web
    name: private-chat-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_PATH
        value: /app/storage

  # ── Frontend (React + Vite static build) ─────────────────────────────────
  - type: static_site
    name: private-chat-frontend
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_BASE_URL
        sync: false

databases:
  - name: private-chat-db
    plan: free
    databaseName: private_chat
    ipAllowList: []
