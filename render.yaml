services:
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: "mysql+aiomysql://user:password@your-mysql-host:3306/private_chat"
      - key: DATABASE_URL_SYNC
        value: "mysql+pymysql://user:password@your-mysql-host:3306/private_chat"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://chatting-orcin-pi.vercel.app"
      - key: STORAGE_PATH
        value: ./storage
    healthCheckPath: /health
