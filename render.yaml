services:
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://your-app.vercel.app"
      - key: STORAGE_PATH
        value: ./storage
    healthCheckPath: /health
    # Render provides postgresql:// URLs, but the app needs driver-specific
    # prefixes. The Dockerfile start script handles this automatically.

databases:
  - name: nexus-db
    plan: free
    databaseName: private_chat
