services:
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: nexus-frontend
          type: web
          property: url
      - key: STORAGE_PATH
        value: ./storage
    healthCheckPath: /health
    # Render provides postgresql:// URLs, but the app needs driver-specific
    # prefixes. The Dockerfile start script handles this automatically.

  - type: web
    name: nexus-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: nexus-backend
          type: web
          property: url
      - key: VITE_WS_BASE_URL
        fromService:
          name: nexus-backend
          type: web
          property: url

databases:
  - name: nexus-db
    plan: free
    databaseName: private_chat
